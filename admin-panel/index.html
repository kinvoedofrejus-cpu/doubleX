<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tontine — Espace Admin</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --surface: #151821;
    --surface-2: #1c202b;
    --border: #262b38;
    --text: #e8eaf0;
    --text-dim: #8b93a7;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  header.app-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
  }
  header.app-header .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
  }
  header.app-header h1 { font-size: 1.15rem; margin: 0; }
  header.app-header p { margin: 2px 0 0; font-size: 0.8rem; color: var(--text-dim); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px;
  }
  .config { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .config input { flex: 1; min-width: 180px; }

  input, select, textarea {
    padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 0.9rem; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

  button {
    padding: 9px 14px; border-radius: 8px; border: none; background: var(--accent);
    color: white; cursor: pointer; font-size: 0.85rem; font-weight: 500;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button.danger { background: transparent; color: var(--red); border: 1px solid rgba(239,68,68,0.4); }
  button.danger:hover { background: rgba(239,68,68,0.12); }
  button.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

  nav {
    display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 5px;
  }
  nav button {
    background: transparent; color: var(--text-dim); font-weight: 500; font-size: 0.8rem;
    padding: 8px 12px; border-radius: 8px;
  }
  nav button:hover { background: var(--surface-2); color: var(--text); }
  nav button.active { background: var(--accent); color: white; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-card .stat-value { font-size: 1.6rem; font-weight: 700; }
  .stat-card .stat-label { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
  .stat-card.warn .stat-value { color: var(--amber); }
  .stat-card.danger .stat-value { color: var(--red); }
  .stat-card.ok .stat-value { color: var(--green); }

  table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  thead th {
    text-align: left; padding: 10px 12px; color: var(--text-dim); font-weight: 600;
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em;
    border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  .table-wrap {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; overflow-x: auto;
  }

  .badge {
    padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
    background: var(--surface-2); color: var(--text-dim); display: inline-block;
  }
  .badge.matured { background: rgba(16,185,129,0.15); color: var(--green); }
  .badge.pending { background: rgba(245,158,11,0.15); color: var(--amber); }
  .badge.mismatch { background: rgba(239,68,68,0.15); color: var(--red); }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button { font-size: 0.75rem; padding: 6px 10px; }

  #status { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 14px; min-height: 1.2em; }
  #status.error { color: var(--red); }

  .plan-form {
    display: grid; gap: 10px; grid-template-columns: 1fr 1fr;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 20px;
  }
  .plan-form button { grid-column: span 2; }
  .section-title { font-size: 0.95rem; font-weight: 600; margin: 20px 0 10px; }
  .empty-state { color: var(--text-dim); font-size: 0.85rem; padding: 20px; text-align: center; }
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">🏦</div>
  <div>
    <h1>Tontine — Espace Admin</h1>
    <p>Gestion des plans, dépôts, retraits et utilisateurs</p>
  </div>
</header>

<div class="card config">
  <input id="workerUrl" placeholder="https://ton-worker.workers.dev" />
  <input id="apiKey" type="password" placeholder="Clé API admin (ADMIN_API_KEY)" />
  <button onclick="saveConfig()">Connexion</button>
</div>
<div id="status"></div>

<nav>
  <button onclick="showTab('overview')" id="tab-overview" class="active">📊 Vue d'ensemble</button>
  <button onclick="showTab('plans')" id="tab-plans">Plans</button>
  <button onclick="showTab('deposits')" id="tab-deposits">Dépôts</button>
  <button onclick="showTab('matured')" id="tab-matured">Comptes à terme</button>
  <button onclick="showTab('mismatched')" id="tab-mismatched">Montants erronés</button>
  <button onclick="showTab('withdrawals')" id="tab-withdrawals">Retraits en attente</button>
  <button onclick="showTab('users')" id="tab-users">👤 Utilisateurs</button>
  <button onclick="showTab('broadcast')" id="tab-broadcast">📢 Annonces</button>
  <button onclick="showTab('audit')" id="tab-audit">Journal d'audit</button>
</nav>

<div id="content"></div>

<script>
let config = { url: localStorage.getItem('tontine_worker_url') || '', key: localStorage.getItem('tontine_api_key') || '' };
document.getElementById('workerUrl').value = config.url;
document.getElementById('apiKey').value = config.key;
let currentTab = 'plans';

function saveConfig() {
  config.url = document.getElementById('workerUrl').value.replace(/\/$/, '');
  config.key = document.getElementById('apiKey').value;
  localStorage.setItem('tontine_worker_url', config.url);
  localStorage.setItem('tontine_api_key', config.key);
  showTab(currentTab);
}

async function api(path, options = {}) {
  const res = await fetch(config.url + path, {
    ...options,
    headers: { 'Authorization': `Bearer ${config.key}`, 'Content-Type': 'application/json', ...(options.headers || {}) },
  });
  if (!res.ok) throw new Error(`Erreur ${res.status}: ${await res.text()}`);
  return res.json();
}

function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (!config.url || !config.key) { setStatus('Renseigne l\'URL du Worker et la clé API ci-dessus.', true); return; }
  setStatus('Chargement...');
  ({ overview: loadOverview, plans: loadPlans, deposits: loadDeposits, matured: loadMatured, mismatched: loadMismatched, withdrawals: loadWithdrawals, users: loadUsers, broadcast: loadBroadcast, audit: loadAudit })[tab]();
}

async function loadOverview() {
  try {
    const [plans, maturedRes, mismatched, pendingRes] = await Promise.all([
      api('/admin/api/plans'),
      api('/admin/api/deposits/matured?limit=1'),
      api('/admin/api/deposits/mismatched'),
      api('/admin/api/withdrawals/pending?limit=1'),
    ]);
    const activePlans = plans.filter(p => p.active).length;

    document.getElementById('content').innerHTML = `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">${activePlans}</div>
          <div class="stat-label">Plans actifs</div>
        </div>
        <div class="stat-card ok">
          <div class="stat-value">${maturedRes.total ?? 0}</div>
          <div class="stat-label">Comptes à terme</div>
        </div>
        <div class="stat-card ${mismatched.length ? 'danger' : ''}">
          <div class="stat-value">${mismatched.length}</div>
          <div class="stat-label">Montants à régulariser</div>
        </div>
        <div class="stat-card ${pendingRes.total ? 'warn' : ''}">
          <div class="stat-value">${pendingRes.total ?? 0}</div>
          <div class="stat-label">Retraits à valider</div>
        </div>
      </div>
      <div class="card">
        <p style="margin:0; color:var(--text-dim); font-size:0.85rem">
          👋 Bienvenue dans l'espace admin. Les retraits sont <b style="color:var(--green)">automatiques par défaut</b> —
          seuls les utilisateurs que tu bloques dans l'onglet <b>Utilisateurs</b> nécessitent ta validation.
          Consulte l'onglet <b>Montants erronés</b> régulièrement pour régulariser ou rembourser les dépôts hors plan.
        </p>
      </div>
    `;
    setStatus('');
  } catch (e) { setStatus(e.message, true); }
}

async function loadPlans() {
  try {
    const plans = await api('/admin/api/plans');
    let html = `
      <div class="plan-form">
        <input id="p-name" placeholder="Nom du plan" />
        <select id="p-amount-type"><option value="fixed">Montant fixe</option><option value="range">Plage min-max</option></select>
        <input id="p-amount-fixed" placeholder="Montant fixe (USDT)" type="number" />
        <input id="p-amount-min" placeholder="Min (USDT)" type="number" />
        <input id="p-amount-max" placeholder="Max (USDT)" type="number" />
        <input id="p-duration" placeholder="Durée (jours)" type="number" />
        <input id="p-gain" placeholder="Gain (%)" type="number" value="0" />
        <button onclick="createPlan()">➕ Créer le plan</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Nom</th><th>Montant</th><th>Durée</th><th>Gain</th><th>Actif</th><th></th></tr></thead><tbody>`;
    for (const p of plans) {
      const amount = p.amount_type === 'fixed' ? `${p.amount_fixed} USDT` : `${p.amount_min}-${p.amount_max} USDT`;
      html += `<tr>
        <td>${p.name}</td><td>${amount}</td><td>${p.duration_days}j</td><td>+${p.gain_percent}%</td>
        <td>${p.active ? '✅' : '❌'}</td>
        <td class="actions">${p.active ? `<button class="danger" onclick="deactivatePlan(${p.id})">Désactiver</button>` : ''}</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
    setStatus(`${plans.length} plan(s)`);
  } catch (e) { setStatus(e.message, true); }
}

async function createPlan() {
  const amountType = document.getElementById('p-amount-type').value;
  const body = {
    name: document.getElementById('p-name').value,
    amount_type: amountType,
    duration_days: Number(document.getElementById('p-duration').value),
    gain_percent: Number(document.getElementById('p-gain').value || 0),
  };
  if (amountType === 'fixed') body.amount_fixed = Number(document.getElementById('p-amount-fixed').value);
  else { body.amount_min = Number(document.getElementById('p-amount-min').value); body.amount_max = Number(document.getElementById('p-amount-max').value); }

  try { await api('/admin/api/plans', { method: 'POST', body: JSON.stringify(body) }); loadPlans(); }
  catch (e) { setStatus(e.message, true); }
}

async function deactivatePlan(id) {
  if (!confirm('Désactiver ce plan ?')) return;
  try { await api(`/admin/api/plans/${id}`, { method: 'DELETE' }); loadPlans(); }
  catch (e) { setStatus(e.message, true); }
}

function userLabel(u) {
  if (u.username) return '@' + u.username;
  if (u.first_name) return u.first_name + ' (' + u.telegram_id + ')';
  return String(u.telegram_id);
}

async function loadDeposits() {
  try {
    const { results } = await api('/admin/api/deposits?limit=100');
    let html = '<div class="table-wrap"><table><thead><tr><th>#</th><th>Utilisateur</th><th>Plan</th><th>Statut</th><th>Montant</th><th>Adresse dépôt</th></tr></thead><tbody>';
    for (const d of results) {
      html += `<tr><td>${d.id}</td><td>${userLabel(d)}</td><td>${d.plan_name}</td>
        <td><span class="badge">${d.status}</span></td><td>${d.amount_received ?? '-'}</td>
        <td style="font-size:0.7rem">${d.tron_address}</td></tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
    setStatus(`${results.length} dépôt(s)`);
  } catch (e) { setStatus(e.message, true); }
}

async function loadMatured() {
  try {
    const { results } = await api('/admin/api/deposits/matured?limit=100');
    let html = '<div class="table-wrap"><table><thead><tr><th>Dépôt #</th><th>Utilisateur</th><th>Plan</th><th>Statut</th><th>Adresse de retrait</th><th>Montant retrait</th></tr></thead><tbody>';
    for (const d of results) {
      html += `<tr><td>${d.deposit_id}</td><td>${userLabel(d)}</td><td>${d.plan_name}</td>
        <td><span class="badge matured">${d.status}</span></td>
        <td style="font-size:0.7rem">${d.withdrawal_address ?? '⚠️ non définie'}</td>
        <td>${d.withdrawal_amount ?? '-'}</td></tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
    setStatus(`${results.length} compte(s) arrivé(s) à terme`);
  } catch (e) { setStatus(e.message, true); }
}

async function loadMismatched() {
  try {
    const results = await api('/admin/api/deposits/mismatched');
    let html = '<div class="table-wrap"><table><thead><tr><th>#</th><th>Utilisateur</th><th>Plan</th><th>Montant reçu</th><th>Adresse</th><th>Actions</th></tr></thead><tbody>';
    for (const d of results) {
      html += `<tr><td>${d.id}</td><td>${userLabel(d)}</td><td>${d.plan_name}</td>
        <td><span class="badge mismatch">${d.amount_received} USDT</span></td>
        <td style="font-size:0.7rem">${d.tron_address}</td>
        <td class="actions">
          <button onclick="regularize(${d.id})">✅ Accepter</button>
          <button class="danger" onclick="refund(${d.id})">↩️ Rembourser</button>
        </td></tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
    setStatus(`${results.length} dépôt(s) à régulariser`);
  } catch (e) { setStatus(e.message, true); }
}

async function regularize(id) {
  if (!confirm('Accepter ce montant et laisser le dépôt reprendre son cours normal ?')) return;
  try { await api(`/admin/api/deposits/${id}/regularize`, { method: 'POST' }); loadMismatched(); }
  catch (e) { setStatus(e.message, true); }
}

async function refund(id) {
  const address = prompt('Adresse TRON de destination pour le remboursement :');
  if (!address) return;
  try { await api(`/admin/api/deposits/${id}/refund`, { method: 'POST', body: JSON.stringify({ destination_address: address }) }); loadMismatched(); }
  catch (e) { setStatus(e.message, true); }
}

async function loadWithdrawals() {
  try {
    const [pendingRes, upcomingRes] = await Promise.all([
      api('/admin/api/withdrawals/pending?limit=100'),
      api('/admin/api/withdrawals/upcoming?limit=100'),
    ]);

    let html = '<div class="section-title">🔴 En attente de validation (utilisateurs bloqués, ou au-delà d\'un seuil si configuré)</div>';
    if (!pendingRes.results.length) {
      html += '<p class="empty-state">Aucune demande en attente.</p>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>#</th><th>Utilisateur</th><th>Montant</th><th>Destination</th><th>Actions</th></tr></thead><tbody>';
      for (const w of pendingRes.results) {
        html += `<tr><td>${w.id}</td><td>${userLabel(w)}</td><td>${w.amount} USDT</td>
          <td style="font-size:0.7rem">${w.destination_address}</td>
          <td class="actions">
            <button onclick="approveWithdrawal(${w.id})">✅ Valider</button>
            <button class="danger" onclick="rejectWithdrawal(${w.id})">❌ Refuser</button>
          </td></tr>`;
      }
      html += '</tbody></table></div>';
    }

    html += '<div class="section-title" style="margin-top:24px">🟡 Approuvés, en cours d\'envoi</div>';
    if (!upcomingRes.results.length) {
      html += '<p class="empty-state">Aucun retrait en file d\'attente pour le moment.</p>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>#</th><th>Utilisateur</th><th>Montant</th><th>Destination</th><th>Envoi prévu</th><th>Actions</th></tr></thead><tbody>';
      for (const w of upcomingRes.results) {
        html += `<tr><td>${w.id}</td><td>${userLabel(w)}</td><td>${w.amount} USDT</td>
          <td style="font-size:0.7rem">${w.destination_address}</td>
          <td style="font-size:0.75rem">${w.eligible_at ?? 'dès maintenant'}</td>
          <td class="actions">
            <button class="danger" onclick="rejectWithdrawal(${w.id})">🛑 Bloquer ce retrait</button>
            <button class="danger" onclick="blockUser(${w.user_id})">🚫 Bloquer l'utilisateur</button>
          </td></tr>`;
      }
      html += '</tbody></table></div>';
    }

    document.getElementById('content').innerHTML = html;
    setStatus(`${pendingRes.results.length} à valider, ${upcomingRes.results.length} en attente d'envoi`);
  } catch (e) { setStatus(e.message, true); }
}

async function approveWithdrawal(id) {
  try { await api(`/admin/api/withdrawals/${id}/approve`, { method: 'POST' }); loadWithdrawals(); }
  catch (e) { setStatus(e.message, true); }
}
async function rejectWithdrawal(id) {
  if (!confirm('Refuser ce retrait ?')) return;
  try { await api(`/admin/api/withdrawals/${id}/reject`, { method: 'POST' }); loadWithdrawals(); }
  catch (e) { setStatus(e.message, true); }
}

async function loadUsers(query) {
  try {
    const search = query !== undefined ? query : (document.getElementById('u-search')?.value || '');
    const users = await api('/admin/api/users' + (search ? `?search=${encodeURIComponent(search)}` : ''));
    let html = `
      <div class="config" style="margin-bottom:16px">
        <input id="u-search" placeholder="Chercher par @pseudo ou ID Telegram" value="${search}" onkeydown="if(event.key==='Enter') loadUsers()" />
        <button onclick="loadUsers()">🔍 Chercher</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Utilisateur</th><th>Adresse de retrait</th><th>Statut</th><th>Actions</th></tr></thead><tbody>`;
    for (const u of users) {
      html += `<tr><td>${userLabel(u)}</td>
        <td style="font-size:0.7rem">${u.withdrawal_address ?? '—'}</td>
        <td>${u.withdrawals_blocked ? '<span class="badge mismatch">🚫 Bloqué</span>' : '<span class="badge matured">✅ Normal</span>'}</td>
        <td class="actions">${u.withdrawals_blocked
          ? `<button onclick="unblockUser(${u.id})">✅ Débloquer</button>`
          : `<button class="danger" onclick="blockUser(${u.id})">🚫 Bloquer les retraits</button>`}</td></tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
    setStatus(`${users.length} utilisateur(s)`);
  } catch (e) { setStatus(e.message, true); }
}

async function blockUser(id) {
  if (!confirm('Bloquer cet utilisateur ? Tous ses futurs retraits nécessiteront ta validation manuelle, quel que soit le montant.')) return;
  try { await api(`/admin/api/users/${id}/block`, { method: 'POST' }); loadUsers(); }
  catch (e) { setStatus(e.message, true); }
}

async function unblockUser(id) {
  try { await api(`/admin/api/users/${id}/unblock`, { method: 'POST' }); loadUsers(); }
  catch (e) { setStatus(e.message, true); }
}

function loadBroadcast() {
  document.getElementById('content').innerHTML = `
    <div class="plan-form" style="grid-template-columns: 1fr;">
      <textarea id="b-message" rows="5" placeholder="Ton annonce (envoyée à tous les utilisateurs du bot, en plus de la chaîne si configurée)" style="padding:8px; border-radius:6px; border:1px solid #333; background:#0f1115; color:#e6e6e6; font-family:inherit;"></textarea>
      <button onclick="sendBroadcast()">📢 Envoyer à tous les utilisateurs</button>
    </div>`;
  setStatus('');
}

async function sendBroadcast() {
  const message = document.getElementById('b-message').value.trim();
  if (!message) { setStatus('Écris un message avant d\'envoyer.', true); return; }
  if (!confirm('Envoyer cette annonce à TOUS les utilisateurs du bot ?')) return;
  try {
    const result = await api('/admin/api/broadcast', { method: 'POST', body: JSON.stringify({ message }) });
    setStatus(`Annonce envoyée à ${result.recipient_count} utilisateur(s) (envoi en cours en arrière-plan).`);
    document.getElementById('b-message').value = '';
  } catch (e) { setStatus(e.message, true); }
}

async function loadAudit() {
  try {
    const { results } = await api('/admin/api/audit-log?limit=100');
    let html = '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Action</th><th>Détails</th></tr></thead><tbody>';
    for (const a of results) {
      html += `<tr><td style="font-size:0.75rem">${a.created_at}</td><td>${a.action}</td><td style="font-size:0.7rem">${a.details}</td></tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
    setStatus(`${results.length} entrée(s)`);
  } catch (e) { setStatus(e.message, true); }
}

if (config.url && config.key) showTab('overview');
</script>
</body>
</html>
